<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tổng quan admin, thanh bên sáng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
</style>
</helmet>
<dc-import name="Main" sidebar="Sáng" theme="{{theme}}" hint-size="100%,1400px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'Nền xám' };
  }
}
</script>
</body>
</html>
