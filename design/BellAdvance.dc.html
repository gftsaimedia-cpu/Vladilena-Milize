<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chuông · Tạm ứng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
</style>
</helmet>
<div style="position: relative; width: 100%; height: 1400px; overflow: hidden;">
<dc-import name="BellInbox" theme="{{theme}}" sidebar="{{sidebar}}" f="need" sel="a1" hint-size="100%,1400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"sidebar":{"editor":"enum","options":["Tối","Sáng"],"default":"Tối","section":"Khung"},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  // Cùng bảng C, chỉ mở sẵn ở tab Cần duyệt, đơn của Mai Phương Thảo
  renderVals() {
    return { theme: this.props.theme ?? 'Nền xám', sidebar: this.props.sidebar ?? 'Tối' };
  }
}
</script>
</body>
</html>
