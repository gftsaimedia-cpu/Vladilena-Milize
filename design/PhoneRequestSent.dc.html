<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đã gửi yêu cầu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Geist; src: url("/_blob/408154e04f313c54998bea9c3f98f182") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "League Spartan"; src: url("/_blob/cd12623746d6bbfc6da195a4946a6080") format("woff2"); font-weight: 600; unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: "League Spartan"; src: url("/_blob/fd9de8133057c7ea3e38abcb3bc6c389") format("woff2"); font-weight: 600; }
body { margin: 0; }
/* Thông báo nổi ngay trên thanh tab, tự tắt */
.toast { position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #1c1c1c; color: #ffffff; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-weight: 500; }
.toast svg { flex: none; color: #e8c372; }
</style>
</helmet>
<div style="--page: {{c.page}}; --border: {{c.border}}; position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.page}};">
<dc-import name="PhoneRequests" theme="{{theme}}" moi="{{yes}}" hint-size="390px,844px"></dc-import>
<div class="toast" role="status"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Đã gửi yêu cầu</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kem = (this.props.theme ?? 'Nền xám') === 'Nền kem';
    const c = kem ? { page: '#f2ead8', border: '#e6dcc6' } : { page: '#f5f5f5', border: '#e0e0e0' };
    return { c, theme: this.props.theme ?? 'Nền xám', yes: true };
  }
}
</script>
</body>
</html>
