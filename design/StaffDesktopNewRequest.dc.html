<helmet>
<style>

@font-face { font-family: "League Spartan"; src: url("/_blob/cd12623746d6bbfc6da195a4946a6080") format("woff2"); font-weight: 600; unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: "League Spartan"; src: url("/_blob/fd9de8133057c7ea3e38abcb3bc6c389") format("woff2"); font-weight: 600; }
body { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #212121; outline-offset: 2px; }

.mut { color: #616161; }
.sm { font-size: 12px; line-height: 16px; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rb { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50px; border: 1px solid var(--border); background: #ffffff; color: #212121; padding: 0; text-decoration: none; cursor: pointer; }
/* Ngăn kéo bên phải như K2, thay cho hộp trượt của app điện thoại (J8, J9) */
.scrim { position: absolute; inset: 0; z-index: 5; background: rgba(28, 28, 28, 0.4); }
.drw { position: absolute; top: 16px; right: 16px; bottom: 16px; z-index: 6; width: 440px; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; flex-direction: column; padding: 24px; border-radius: 24px; background: #ffffff; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #212121; font-variant-numeric: tabular-nums; }
.drw h2 { margin: 0; font-family: 'League Spartan', Geist, sans-serif; font-size: 28px; line-height: 32px; font-weight: 600; }
.stp { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
/* Bước 1: danh sách loại yêu cầu */
.ls { display: flex; flex-direction: column; }
.ro { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.ro + .ro { border-top: 1px solid var(--border); }
.ro .t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ro .t b { font-weight: 600; }
.ro .chev { flex: none; color: #616161; }
.ti { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--page); color: #212121; }
/* Bước 2: ô nhập bo 8px, không bóng */
.fl { display: flex; flex-direction: column; gap: 8px; }
.fl label { font-weight: 600; }
.in { height: 48px; width: 100%; box-sizing: border-box; margin: 0; padding: 0 12px; border-radius: 8px; border: 1px solid #8a8a8a; background: #ffffff; font: inherit; color: #212121; }
.in::placeholder { color: #757575; }
.box { position: relative; }
.box svg { position: absolute; top: 14px; pointer-events: none; color: #616161; }
.sel .in { appearance: none; -webkit-appearance: none; padding-right: 44px; }
.sel svg { right: 14px; }
.dt .in { padding-left: 42px; }
.dt svg { left: 12px; }
textarea.in { height: 120px; padding: 12px; resize: none; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sum { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--page); }
.b1 { height: 48px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 0; background: #1c1c1c; color: #ffffff; font: inherit; font-weight: 600; display: grid; place-items: center; text-decoration: none; }
</style>
</helmet>
<div style="--page: {{c.page}}; --border: {{c.border}}; position: relative; width: 100%; height: 900px; overflow: hidden; background: {{c.page}};">
<dc-import name="StaffDesktop" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" class="scrim"></div>
<aside class="drw" role="dialog" aria-modal="true" aria-label="Tạo yêu cầu">

<div class="stp" hidden="{{h.pick}}">
<div class="sh" style="align-items: flex-start;">
<div><h2>Tạo yêu cầu</h2><div class="mut" style="margin-top: 4px;">Chọn loại để điền đơn</div></div>
<a class="rb" href="StaffDesktop.dc.html" aria-label="Đóng"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<div class="ls">
<button type="button" class="ro" onClick="{{toForm}}"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4"></path><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="m9 15 2 2 4-4"></path></svg></span><span class="t"><b>Đơn nghỉ</b><span class="mut sm">Phép năm còn 11 ngày</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" class="ro"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M8 16H3v5"></path></svg></span><span class="t"><b>Nghỉ có làm bù</b><span class="mut sm">Nghỉ 1 ngày thì bù đủ 8 giờ trong tháng</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" class="ro"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-9 9"></path><path d="M12 7v5l3 2"></path><path d="M19 15v6M16 18h6"></path></svg></span><span class="t"><b>Làm thêm giờ</b><span class="mut sm">Ngoài ca, cách ca ít nhất 1 giờ</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" class="ro"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg></span><span class="t"><b>Đổi ca</b><span class="mut sm">Normal, Flex hoặc Night cho một khoảng ngày</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" class="ro"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><path d="M8 9h8M8 13h5"></path></svg></span><span class="t"><b>Giải trình</b><span class="mut sm">Cho một ngày chấm công chưa hợp lệ</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
<button type="button" class="ro"><span class="ti"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M14.8 9a3 3 0 0 0-2.8-1.5c-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2A3.2 3.2 0 0 1 9 15M12 6v1.5M12 16.5V18"></path></svg></span><span class="t"><b>Tạm ứng</b><span class="mut sm">Ứng trước một phần lương tháng</span></span><svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
</div>

<div class="stp" hidden="{{h.form}}">
<div class="sh">
<button type="button" class="rb" onClick="{{toPick}}" aria-label="Quay lại chọn loại"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></button>
<h2 style="flex: 1 1 auto;">Đơn nghỉ</h2>
<a class="rb" href="StaffDesktop.dc.html" aria-label="Đóng"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<div class="fl">
<label for="k3-loai">Hình thức nghỉ</label>
<div class="box sel"><select id="k3-loai" class="in" value="{{loai}}" onChange="{{onLoai}}"><option>Phép năm</option><option>Việc riêng có lương</option><option>Việc riêng không lương</option><option>Chế độ BHXH</option><option>Phúc lợi nội bộ</option><option>Không lương</option></select><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
</div>
<div class="fl" style="gap: 12px;">
<div class="two">
<div class="fl"><label for="k3-tu">Từ ngày</label><div class="box dt"><input id="k3-tu" class="in" type="text" value="T6 13/11/2026"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div></div>
<div class="fl"><label for="k3-den">Đến ngày</label><div class="box dt"><input id="k3-den" class="in" type="text" value="T2 16/11/2026"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div></div>
</div>
<div class="sum" aria-live="polite"><div><b>3 ngày làm việc:</b> 13, 14 và 16/11</div><div class="mut" hidden="{{h.bal}}">Phép năm còn 11 ngày, sau đơn này còn 8</div></div>
</div>
<div class="fl">
<label for="k3-ly">Lý do</label>
<textarea id="k3-ly" class="in" placeholder="Ghi rõ trường hợp, ví dụ: việc gia đình, kết hôn"></textarea>
</div>
<a class="b1" href="StaffDesktop.dc.html" style="margin-top: auto;">Gửi yêu cầu</a>
</div>

</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  st() { return { step: 'form', loai: 'Phép năm', ...(this.state || {}) }; }
  toForm = () => this.setState({ ...this.st(), step: 'form' });
  toPick = () => this.setState({ ...this.st(), step: 'pick' });
  onLoai = (e) => this.setState({ ...this.st(), loai: e.target.value });
  renderVals() {
    const kem = (this.props.theme ?? 'Nền xám') === 'Nền kem';
    const c = kem ? { page: '#f2ead8', border: '#e6dcc6' } : { page: '#f5f5f5', border: '#e0e0e0' };
    const x = this.st();
    // Board mở sẵn ở bước điền đơn; nút quay lại cho xem bước chọn loại
    const h = { pick: x.step !== 'pick', form: x.step !== 'form', bal: x.loai !== 'Phép năm' };
    return { c, theme: this.props.theme ?? 'Nền xám', loai: x.loai, h, toForm: this.toForm, toPick: this.toPick, onLoai: this.onLoai };
  }
}
</script>
