<!doctype html>

</head>

<helmet>
<style>
@font-face { font-family: Geist; src: url("/_blob/408154e04f313c54998bea9c3f98f182") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "League Spartan"; src: url("/_blob/cd12623746d6bbfc6da195a4946a6080") format("woff2"); font-weight: 600; unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }

body { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible { outline: 2px solid #212121; outline-offset: 2px; }

.mut { color: #616161; }
.sm { font-size: 12px; line-height: 16px; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rb { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50px; border: 1px solid var(--border); background: #ffffff; color: #212121; padding: 0; text-decoration: none; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50px; display: inline-block; }
.dot.rej { background: #b43f3f; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.kv .k { color: #616161; white-space: nowrap; }
.kv .v { font-weight: 500; text-align: right; }
.b2 { height: 48px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #8a8a8a; background: #ffffff; font: inherit; font-weight: 600; color: #212121; display: grid; place-items: center; text-decoration: none; }
.steps { display: flex; flex-direction: column; gap: 0; }
.sp { display: flex; gap: 12px; }
.sp .rail { display: flex; flex-direction: column; align-items: center; width: 12px; }
.sp .rail i { width: 12px; height: 12px; border-radius: 50px; background: #2f5aa8; margin-top: 4px; }
.sp .rail i.rej { background: #b43f3f; }
.sp .rail b { flex: 1 1 auto; width: 2px; background: var(--border); margin: 4px 0; }
.sp .tx { flex: 1 1 auto; min-width: 0; padding-bottom: 14px; }
.nb { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding: 12px 14px; border-radius: 12px; background: var(--page); }

/* Ngăn kéo bên phải thay cho hộp trượt J5b của app điện thoại, giống K2 */
.scrim { position: absolute; inset: 0; z-index: 5; background: rgba(28, 28, 28, 0.4); }
.drw { position: absolute; top: 16px; right: 16px; bottom: 16px; z-index: 6; width: 440px; max-width: calc(100% - 32px); box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 24px; background: #ffffff; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #212121; font-variant-numeric: tabular-nums; overflow-y: auto; }
.drw h2 { margin: 0; font-family: 'League Spartan', Geist, sans-serif; font-size: 28px; line-height: 32px; font-weight: 600; }
</style>
</helmet>
<div style="--page: {{c.page}}; --border: {{c.border}}; position: relative; width: 100%; height: 900px; overflow: hidden; background: {{c.page}};">
<dc-import name="StaffDesktop" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" class="scrim"></div>
<aside class="drw" role="dialog" aria-modal="true" aria-label="Khai giờ vào 09/09">
<div class="sh" style="align-items: flex-start;">
<div><h2>Khai giờ vào 09/09</h2><div class="mut" style="margin-top: 4px;">Giải trình</div></div>
<a class="rb" href="StaffDesktop.dc.html" aria-label="Đóng"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<span class="st"><i class="dot rej"></i>Từ chối</span>
<div>
<div class="kv" style="border-top: 0;"><span class="k">Ngày</span><span class="v">Thứ Tư 09/09/2026</span></div>
<div class="kv"><span class="k">Giờ vào khai</span><span class="v">08:00</span></div>
<div class="kv"><span class="k">Lý do</span><span class="v">“Máy chấm công không nhận.”</span></div>
</div>
<div class="steps" aria-label="Các bước">
<div class="sp"><div class="rail"><i></i><b></b></div><div class="tx"><div style="font-weight: 600;">Đã gửi</div><div class="mut">09/09 17:45</div></div></div>
<div class="sp"><div class="rail"><i class="rej"></i></div><div class="tx" style="padding-bottom: 0;"><div style="font-weight: 600;">Admin đã từ chối</div><div class="mut">10/09 10:15</div>
<div class="nb"><span class="mut sm">Lý do từ chối</span><span>“Máy chấm công vẫn ghi nhận ngày 09/09, giờ vào 08:47.”</span></div>
</div></div>
</div>
<a class="b2" href="StaffDesktop.dc.html" style="margin-top: auto;">Đóng</a>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const kem = (this.props.theme ?? 'Nền xám') === 'Nền kem';
    const c = kem ? { page: '#f2ead8', border: '#e6dcc6' } : { page: '#f5f5f5', border: '#e0e0e0' };
    return { c, theme: this.props.theme ?? 'Nền xám' };
  }
}
</script>
</body>
</html>
