<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"moi":{"editor":null,"default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  st() { return { tab: 'all', ...(this.state || {}) }; }
  pickOf = (k) => () => this.setState({ ...this.st(), tab: k });
  renderVals() {
    const kem = (this.props.theme ?? 'Nền xám') === 'Nền kem';
    const c = kem ? { page: '#f2ead8', border: '#e6dcc6' } : { page: '#f5f5f5', border: '#e0e0e0' };
    const x = this.st();
    const moi = this.props.moi === true;
    const rows = [...(moi ? [["r0","pend",11]] : []), ["r1","pend",10],["r2","done",10],["r3","done",9],["r4","rej",9]];
    const h = { r0: true }, sel = {}, pick = {}, n = { all: rows.length, pend: 0, done: 0, rej: 0 };
    rows.forEach(([id, k]) => { h[id] = !(x.tab === 'all' || x.tab === k); n[k] += 1; });
    ['all', 'pend', 'done', 'rej'].forEach((k) => { sel[k] = String(x.tab === k); pick[k] = this.pickOf(k); });
    const g11 = !rows.some(([id, , m]) => m === 11 && !h[id]);
    const g10 = !rows.some(([id, , m]) => m === 10 && !h[id]);
    const g9 = !rows.some(([id, , m]) => m === 9 && !h[id]);
    const extra = { h: { ...h, g11, g10, g9 }, sel, pick, n };
    return { c, theme: this.props.theme ?? 'Nền xám', ...extra };
  }
}
