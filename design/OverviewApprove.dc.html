<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tổng quan · cửa sổ duyệt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
</style>
</helmet>
<div style="position: relative; width: 100%; height: 1400px; overflow: hidden;">
<dc-import name="Main" theme="{{theme}}" sidebar="{{sidebar}}" yeucau="Trong chuông" sel="l2" hint-size="100%,1400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"sidebar":{"editor":"enum","options":["Tối","Sáng"],"default":"Tối","section":"Khung"},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  // Cùng bảng A, mở sẵn cửa sổ duyệt đơn nghỉ ốm của Bùi Quốc Huy: như khi bấm dòng đó ở thẻ Việc cần duyệt
  renderVals() {
    return { theme: this.props.theme ?? 'Nền xám', sidebar: this.props.sidebar ?? 'Tối' };
  }
}
</script>
</body>
</html>
