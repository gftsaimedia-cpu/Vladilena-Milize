<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tạo yêu cầu · nghỉ có làm bù</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: Geist; src: url("/_blob/408154e04f313c54998bea9c3f98f182") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "League Spartan"; src: url("/_blob/cd12623746d6bbfc6da195a4946a6080") format("woff2"); font-weight: 600; unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
@font-face { font-family: "League Spartan"; src: url("/_blob/fd9de8133057c7ea3e38abcb3bc6c389") format("woff2"); font-weight: 600; }
body { margin: 0; }
[hidden] { display: none !important; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #212121; outline-offset: 2px; }

.mut { color: #616161; }
.sm { font-size: 12px; line-height: 16px; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rb { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50px; border: 1px solid var(--border); background: #ffffff; color: #212121; padding: 0; text-decoration: none; }
.scrim { position: absolute; inset: 0; z-index: 5; background: rgba(28, 28, 28, 0.4); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 24px; border-radius: 24px 24px 0 0; background: #ffffff; font-family: Geist, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #212121; font-variant-numeric: tabular-nums; }
.sheet .grab { width: 40px; height: 4px; border-radius: 50px; background: #e0e0e0; margin: 0 auto -4px; }
.sheet h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }
.fl { display: flex; flex-direction: column; gap: 8px; }
.fl label, .lb { font-weight: 600; }
.in { height: 48px; width: 100%; box-sizing: border-box; margin: 0; padding: 0 12px; border-radius: 8px; border: 1px solid #8a8a8a; background: #ffffff; font: inherit; color: #212121; }
.in::placeholder { color: #757575; }
.box { position: relative; }
.box svg { position: absolute; top: 14px; pointer-events: none; color: #616161; }
.sel .in { appearance: none; -webkit-appearance: none; padding-right: 44px; }
.sel svg { right: 14px; }
textarea.in { height: 72px; padding: 12px; resize: none; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sum { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--page); }
.b1 { height: 48px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 0; background: #1c1c1c; color: #ffffff; font: inherit; font-weight: 600; display: grid; place-items: center; text-decoration: none; }
.b1:disabled { background: #e0e0e0; color: #616161; }
.b2 { height: 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #8a8a8a; background: #ffffff; color: #212121; font: inherit; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
.b2:disabled { color: #616161; border-color: #e0e0e0; }
/* Khung bù: ngày, từ giờ, đến giờ, nút bỏ trên một dòng */
.slot { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.slot .in { padding: 0 26px 0 10px; }
.slot .box svg { right: 8px; top: 16px; }
.xb { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; border: 1px solid #8a8a8a; background: #ffffff; color: #212121; padding: 0; }
.cnt { font-weight: 600; }
</style>
</helmet>
<div style="--page: {{c.page}}; --border: {{c.border}}; position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.page}};">
<dc-import name="PhoneRequests" theme="{{theme}}" hint-size="390px,844px"></dc-import>
<div aria-hidden="true" class="scrim"></div>
<section class="sheet" role="dialog" aria-label="Nghỉ có làm bù">
<div class="grab"></div>
<div class="sh">
<a class="rb" href="PhoneNewRequest.dc.html" aria-label="Quay lại chọn loại"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg></a>
<h2 style="flex: 1 1 auto;">Nghỉ có làm bù</h2>
<a class="rb" href="PhoneRequests.dc.html" aria-label="Đóng"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<div class="fl" style="gap: 12px;">
<div class="two">
<div class="fl"><label for="j14-tu">Từ ngày</label><div class="box sel"><select id="j14-tu" class="in"><option>T2 02/11</option><option>T3 03/11</option><option>T4 04/11</option><option>T5 05/11</option></select><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div></div>
<div class="fl"><label for="j14-den">Đến ngày</label><div class="box sel"><select id="j14-den" class="in"><option>T2 02/11</option><option>T3 03/11</option><option>T4 04/11</option></select><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div></div>
</div>
<div class="sum"><div><b>1 ngày làm việc:</b> 02/11</div><div class="mut">Cần bù 8 giờ, sau ngày nghỉ cuối và trong tháng 11</div></div>
</div>
<div class="fl">
<div class="sh"><span class="lb">Khung bù</span><span class="cnt" aria-live="polite">Đã xếp {{total}} / {{need}} giờ</span></div>
<div class="slot mut sm" aria-hidden="true"><span>Ngày</span><span>Từ</span><span>Đến</span><span></span></div>
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="2">
<div class="slot">
<div class="box sel"><select class="in" aria-label="Ngày bù, khung {{sl.n}}" value="{{sl.d}}" onChange="{{sl.onD}}"><sc-for list="{{dates}}" as="o" hint-placeholder-count="6"><option>{{o}}</option></sc-for></select><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
<div class="box sel"><select class="in" aria-label="Từ giờ, khung {{sl.n}}" value="{{sl.s}}" onChange="{{sl.onS}}"><sc-for list="{{sl.starts}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
<div class="box sel"><select class="in" aria-label="Đến giờ, khung {{sl.n}}" value="{{sl.e}}" onChange="{{sl.onE}}"><sc-for list="{{sl.ends}}" as="o" hint-placeholder-count="4"><option>{{o}}</option></sc-for></select><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></div>
<button class="xb" type="button" aria-label="Bỏ khung {{sl.n}}" onClick="{{sl.del}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
</sc-for>
<button class="b2" type="button" style="align-self: flex-start;" onClick="{{add}}" disabled="{{noAdd}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Thêm khung bù</button>
</div>
<div class="fl">
<label for="j14-ly">Lý do</label>
<textarea id="j14-ly" class="in" placeholder="Ví dụ: việc gia đình buổi sáng"></textarea>
</div>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><a class="b1" href="PhoneRequestSent.dc.html">Gửi yêu cầu</a></sc-if>
<sc-if value="{{notFull}}" hint-placeholder-val="{{ false }}"><div class="fl" style="gap: 6px;"><button class="b1" type="button" disabled>Gửi yêu cầu</button><span class="mut sm" style="text-align: center;">Xếp đủ {{need}} giờ bù thì mới gửi được</span></div></sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Nền xám","Nền kem"],"default":"Nền xám","section":"Màu"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  st() { return { slots: [{ d: 'T3 03/11', s: '18:00', e: '22:00' }, { d: 'CN 08/11', s: '08:00', e: '12:00' }], ...(this.state || {}) }; }
  renderVals() {
    const kem = (this.props.theme ?? 'Nền xám') === 'Nền kem';
    const c = kem ? { page: '#f2ead8', border: '#e6dcc6' } : { page: '#f5f5f5', border: '#e0e0e0' };
    const need = 8;
    // Ngày bù: sau ngày nghỉ cuối (02/11), vẫn trong tháng 11. Chủ nhật không có ca nên chọn được 06–22.
    const dates = ['T3 03/11', 'T4 04/11', 'T5 05/11', 'T6 06/11', 'T7 07/11', 'CN 08/11', 'T2 09/11', 'T3 10/11'];
    const hh = (n) => (n < 10 ? '0' : '') + n + ':00';
    const num = (t) => parseInt(t, 10);
    const sun = (d) => d.indexOf('CN') === 0;
    const len = (sl) => num(sl.e) - num(sl.s);
    // Ngày có ca 08–17: chỉ 06–07 và 18–22. Chủ nhật: 06–22, tối đa 12 giờ.
    const startsFor = (d) => { const r = []; if (sun(d)) { for (let h = 6; h <= 21; h++) r.push(hh(h)); } else { r.push(hh(6)); for (let h = 18; h <= 21; h++) r.push(hh(h)); } return r; };
    const endsFor = (d, s, room) => { const a = num(s); const max = sun(d) ? Math.min(22, a + 12) : (a === 6 ? 7 : 22); const r = []; for (let h = a + 1; h <= Math.min(max, a + Math.max(room, 1)); h++) r.push(hh(h)); return r; };
    const sumExcept = (slots, i) => slots.reduce((t, sl, j) => (j === i ? t : t + len(sl)), 0);
    const fix = (slots, i) => {
      const sl = slots[i];
      const starts = startsFor(sl.d);
      const s = starts.indexOf(sl.s) >= 0 ? sl.s : starts[0];
      const ends = endsFor(sl.d, s, need - sumExcept(slots, i));
      const e = ends.indexOf(sl.e) >= 0 ? sl.e : ends[ends.length - 1];
      const out = slots.slice(); out[i] = { d: sl.d, s, e }; return out;
    };
    const x = this.st();
    const total = x.slots.reduce((t, sl) => t + len(sl), 0);
    const put = (i, k) => (ev) => { const slots = x.slots.slice(); slots[i] = { ...slots[i], [k]: ev.target.value }; this.setState({ ...x, slots: fix(slots, i) }); };
    const add = () => { if (total >= need) return; const slots = x.slots.concat([{ d: 'T4 04/11', s: '18:00', e: '22:00' }]); this.setState({ ...x, slots: fix(slots, slots.length - 1) }); };
    const del = (i) => () => this.setState({ ...x, slots: x.slots.filter((_, j) => j !== i) });
    const rows = x.slots.map((sl, i) => ({ ...sl, n: i + 1, starts: startsFor(sl.d), ends: endsFor(sl.d, sl.s, need - sumExcept(x.slots, i)), onD: put(i, 'd'), onS: put(i, 's'), onE: put(i, 'e'), del: del(i) }));
    return { c, theme: this.props.theme ?? 'Nền xám', dates, slots: rows, total, need, full: total === need, notFull: total !== need, noAdd: total >= need, add };
  }
}
</script>
</body>
</html>
